# /etc/nginx/sites-available/crm.iseie.com
# Versión recomendada con:
#   - HTTPS forzado (Certbot).
#   - SPA fallback a /index.html.
#   - Cache largo + immutable para assets versionados (hash en nombre).
#   - Cache zero para index.html, sw.js, manifest.webmanifest (revalidación obligada).
#   - Proxy /api/ → backend PM2 :3005.
#   - Headers de seguridad mínimos.
#
# Para aplicar:
#   sudo cp scripts/nginx-crm-iseie.conf /etc/nginx/sites-available/crm.iseie.com
#   sudo nginx -t && sudo systemctl reload nginx
# (No tocar otros sitios del VPS — esta config solo gestiona crm.iseie.com.)

server {
    server_name crm.iseie.com;
    root /var/www/crm-iseie;
    index index.html;

    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/crm-iseie.access.log;
    error_log /var/log/nginx/crm-iseie.error.log;

    # ────────────────────────────────────────────────────────
    # Headers de seguridad
    # ────────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ────────────────────────────────────────────────────────
    # Backend API
    # ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Las respuestas del API no se cachean en navegador.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ────────────────────────────────────────────────────────
    # Shell de la SPA — SIEMPRE fresca para que cargue el bundle nuevo.
    # ────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 1h;
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────
    # Assets versionados (hash en el filename → invalidación gratuita).
    # ────────────────────────────────────────────────────────
    location ^~ /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────
    # Imágenes públicas + flags + iconos.
    # ────────────────────────────────────────────────────────
    location ~* \.(png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────
    # SPA fallback (todo lo demás → index.html).
    # ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL gestionado por Certbot
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm.iseie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.iseie.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = crm.iseie.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name crm.iseie.com;
    return 404;
}
