# Registro de nginx SIN las llaves del MCP de Claude (#237, desde #193 de MultiCRM).
#
# Es el mismo fichero que nginx/crm-registro-seguro.conf de MultiCRM, con nombres
# propios de ISEIE (iseie_…): este servidor lo comparten otras aplicaciones y,
# si algún día hubiera los dos ficheros en el mismo nginx, dos `map` con el
# mismo nombre impedirían arrancarlo.
#
# La URL personal del MCP lleva la llave dentro (`/api/mcp/u/crm_mcp_…`), y
# nginx la escribía entera en el registro. La aplicación ya la tapa en sus
# propios registros (`urlPersonal` en mcp.auth.js y la ruta OAuth en
# mcp.oauth.js); nginx no. Quien leyera el registro podía conectarse a Claude
# como esa persona.
#
# La llave aparece en tres peticiones, y las tres quedan tapadas, con prefijo
# (/staging) o sin él (producción):
#   POST /api/mcp/u/crm_mcp_…                                    (la URL personal)
#   GET  /.well-known/oauth-protected-resource/api/mcp/u/crm_mcp_… (OAuth)
#   GET  /api/mcp/oauth/authorize?…&resource=…%2Fu%2Fcrm_mcp_…     (OAuth, codificada)
# Y en el Referer, por si una página de esas enlaza a otra.
#
# Se tapa, no se deja de registrar: la línea sigue sirviendo para saber quién
# llamó, cuándo y con qué resultado. Solo cambia la llave por `crm_mcp_***`.
#
# ─── CÓMO SE APLICA (lo hace Diego; Diana no tiene acceso al servidor) ──────
#
#   1. Este fichero va en el contexto `http` (map y log_format no valen dentro
#      de un `server`). En Debian/Ubuntu, conf.d/ ya se incluye ahí:
#        sudo cp nginx/crm-iseie-registro-seguro.conf /etc/nginx/conf.d/crm-iseie-registro-seguro.conf
#
#   2. SOLO en el `server` de crm.iseie.com (el que sirve producción en / y
#      staging en /staging), poner el formato en su línea access_log, con la
#      ruta de registro que ya tenga:
#        access_log <la ruta que ya usa ese server> iseie_seguro;
#      Si ese server no tiene línea access_log propia, añadirla con la ruta que
#      se quiera (por ejemplo /var/log/nginx/crm-iseie.access.log). No se toca
#      el server de ninguna otra aplicación (CLAUDE.md: «NO modificar configs
#      nginx de sitios existentes»).
#
#   3. Comprobar y recargar. `nginx -t` antes, siempre:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Probar en staging (debe salir crm_mcp_*** y NO la llave):
#        curl -s -o /dev/null -X POST https://crm.iseie.com/staging/api/mcp/u/crm_mcp_PRUEBAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#        sudo tail -n 1 <la ruta del access_log de crm.iseie.com>
#
#   Los patrones son los de MultiCRM, probados el 03/10 con nginx 1.27 en Docker
#   delante del CRM local: la llave no queda en el registro y el MCP sigue
#   recibiéndola entera (la máscara solo afecta a lo que se escribe, no a lo que
#   se reenvía).
#
# ─── LO QUE ESTO NO TAPA ────────────────────────────────────────────────────
#
#   error.log: cuando nginx anota un error de una petición (p. ej. un 502 porque
#   la API está caída) escribe `request: "POST /api/mcp/u/crm_mcp_…"` y ese
#   texto no se puede cambiar con log_format. Solo pasa con errores de nginx, no
#   en el uso normal. Se limpia con el mismo comando que los registros viejos
#   (docs/mcp-limpiar-registros-nginx.md).

# La línea de la petición, con la llave tapada. Dos pasadas: una URL normal
# lleva la llave una vez, pero así tampoco se escapa una petición que la lleve
# dos veces (en la ruta y en `resource=`).
map $request $iseie_request_1 {
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $request;
}
map $iseie_request_1 $iseie_request_seguro {
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $iseie_request_1;
}

# El Referer, igual. Vacío se escribe «-», como en `combined`.
map $http_referer $iseie_referer_seguro {
    ""                                                     "-";
    "~^(?<antes>.*?)crm_mcp_[A-Za-z0-9_-]+(?<despues>.*)$"  "${antes}crm_mcp_***${despues}";
    default                                                $http_referer;
}

# El formato `combined` de siempre, con las dos variables tapadas. Mismas
# columnas y mismo orden: lo que ya lea el registro (goaccess, fail2ban, grep)
# sigue funcionando.
log_format iseie_seguro '$remote_addr - $remote_user [$time_local] '
                        '"$iseie_request_seguro" $status $body_bytes_sent '
                        '"$iseie_referer_seguro" "$http_user_agent"';
